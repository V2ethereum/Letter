<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God's Plan 💌</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            background: #faf7f5;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            overflow-x: hidden;
            position: relative;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 10;
        }
        h2 { margin-top: 0; color: #2c3e50; font-weight: 500; }
        p { line-height: 1.7; color: #4a5568; }
        input[type="password"] {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            margin-bottom: 1rem;
        }
        input[type="password"]:focus { border-color: #cbd5e1; }
        button {
            width: 100%;
            padding: 0.8rem;
            background: #2b2d42;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        #error { color: #e53e3e; font-size: 0.875rem; margin-top: 0.75rem; display: none; }
        #content { display: none; animation: fadeIn 0.8s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* Floating Hearts Animation */
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.3);
                opacity: 0;
            }
        }
        .heart {
            position: fixed;
            bottom: -20px;
            font-size: 22px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 4.5s linear forwards;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="lock-screen">
            <h3 style="margin-top: 0; font-weight: 500;">Enter the passcode</h3>
            <p style="font-size: 0.9rem; color: #718096;">A private message waiting for you.</p>
            <input type="password" id="pwd" placeholder="Passcode" autofocus />
            <button onclick="unlock()">Open</button>
            <div id="error">Incorrect passcode. Try again.</div>
        </div>
        <div id="content"></div>
    </div>

    <script>
        function calcOdds() {
            const crowdEl = document.getElementById('crowd');
            const peopleEl = document.getElementById('people');
            if (!crowdEl || !peopleEl) return;

            const N = 3000;
            const n = parseInt(crowdEl.value);
            const c = parseInt(peopleEl.value);

            document.getElementById('crowdVal').innerText = n + " students";
            document.getElementById('peopleVal').innerText = c + " people";

            const p = (n * c) / (N * N);
            const pct = (p * 100).toFixed(3);
            const ratio = Math.round(1 / p);

            document.getElementById('probPercent').innerText = pct + "%";
            document.getElementById('probRatio').innerText = "Around 1 in " + ratio.toLocaleString() + " chance";
        }

        function startFloatingHearts() {
            const emojis = ["❤️", "💖", "🌸", "✨", "💕", "🤍"];
            setInterval(() => {
                const heart = document.createElement("div");
                heart.className = "heart";
                heart.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = Math.random() * 95 + "vw";
                heart.style.animationDuration = (3.5 + Math.random() * 2.5) + "s";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 6500);
            }, 400);
        }

        async function unlock() {
            const pwd = document.getElementById("pwd").value;
            const err = document.getElementById("error");
            err.style.display = "none";

            try {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    "raw", enc.encode(pwd), "PBKDF2", false, ["deriveKey"]
                );
                const key = await crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
                    keyMaterial,
                    { name: "AES-GCM", length: 256 },
                    false,
                    ["decrypt"]
                );
                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    ct
                );
                const dec = new TextDecoder();
                document.getElementById("lock-screen").style.display = "none";
                const content = document.getElementById("content");
                content.innerHTML = dec.decode(decrypted);
                content.style.display = "block";

                // Initialize interactive calculator & floating hearts
                calcOdds();
                startFloatingHearts();
            } catch (e) {
                err.style.display = "block";
            }
        }

        document.getElementById("pwd").addEventListener("keypress", (e) => {
            if (e.key === "Enter") unlock();
        });
    </script>
</body>
</html>
